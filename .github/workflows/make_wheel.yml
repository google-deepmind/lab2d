# A workflow to build wheel packages and create a draft release.

name: release_wheel

on:
  workflow_dispatch:
  push:
    tags:
      - 'release*'

jobs:
  build-wheel:
    name: Build-wheel ${{ matrix.cfg.name }} for Python ${{ matrix.python-version }}

    runs-on: ${{ matrix.cfg.os }}

    strategy:
      matrix:
        cfg:
          - { name: 'Linux x86_64 LLVM+libstdc++', os: 'ubuntu-24.04',     cc: clang, cxx: clang++, config: --linkopt=-fuse-ld=lld }
          - { name: 'Linux ARM64 LLVM+libstdc++',  os: 'ubuntu-24.04-arm', cc: clang, cxx: clang++, config: --linkopt=-fuse-ld=lld --luajit_target_arch=arm64 }
          - { name: 'MacOS 15 x86_64 LLVM+libc++', os: 'macos-15-intel',   cc: clang, cxx: clang++, config: --config=libc++ }
          - { name: 'MacOS 15 ARM64 LLVM+libc++',  os: 'macos-15',         cc: clang, cxx: clang++, config: --config=libc++ --luajit_target_arch=arm64 }
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'

    env:
      CC:  ${{ matrix.cfg.cc }}
      CXX: ${{ matrix.cfg.cxx }}
      GCP_KEY: ${{ secrets.GCP_KEY }}
      WHEEL_NAME: ''

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python Dependencies
        run: |
          pip3 install --upgrade pip packaging check-wheel-contents
          echo "${GCP_KEY}" | base64 -d > "${HOME}/gcp_key.json"

      - name: Build for Python ${{ matrix.python-version }}
        id: build_wheel
        run: bazel --bazelrc=.bazelrc build --remote_cache="https://storage.googleapis.com/dmlab-travis-cache" --google_credentials="${HOME}/gcp_key.json" --compilation_mode=opt --dynamic_mode=off --config=luajit ${{ matrix.cfg.config }} //dmlab2d:dmlab2d_wheel

      - name: Get built wheel name
        working-directory: bazel-bin/dmlab2d
        run: |
          WHEEL_NAME="$(ls *.whl)"
          echo WHEEL_NAME="${WHEEL_NAME}" >> "${GITHUB_ENV}"

      - name: Check wheel contents
        run: check-wheel-contents bazel-bin/dmlab2d/${{ env.WHEEL_NAME }}

      - name: Test wheel
        run: |
          pip install bazel-bin/dmlab2d/${{ env.WHEEL_NAME }}
          python -I - <<'____HERE'
          import dmlab2d
          import dmlab2d.runfiles_helper

          lab = dmlab2d.Lab2d(dmlab2d.runfiles_helper.find(), {"levelName": "chase_eat"})
          env = dmlab2d.Environment(lab, ["WORLD.RGB"])
          env.step({})
          ____HERE

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          path: bazel-bin/dmlab2d/${{ env.WHEEL_NAME }}
          archive: false

  create-release:
    name: Create new draft release

    runs-on: ubuntu-latest
    
    needs: build-wheel

    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.whl \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Release ${GITHUB_REF_NAME}" \
            --draft \
            --generate-notes
